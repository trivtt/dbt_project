version: 2

sources:
  - name: kmr_data_source
    database: data-project-434509
    schema: kmr_data
    tables:
      - name: Data_Check_Duplicate
        # Chuyển mọi cấu hình vào mục config bên dưới
        config:
          loaded_at_field: "CAST(Month AS TIMESTAMP)" # Vì cột Month định dạng date trong khi dbt yêu cầu phải là datetime -> Đổi định dạng sang timestamp
          freshness:
            warn_after: {count: 6, period: hour}
            error_after: {count: 12, period: hour}
        
        