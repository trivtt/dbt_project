version: 2

models: 
      - name: stg_churn_reason
        description: "Bảng ghi nhận lý do rời bỏ của khách hàng"
        tests:
          - dbt_utils.unique_combination_of_columns:
              combination_of_columns: ["Month", "Store_ID"]
        columns:
          - name: Month
            tests:
              - not_null
          - name: Store_ID
            tests:
              - not_null
          - name: Team
            tests:
              - not_null
          - name: Churn_Type
            tests:
              - not_null
